<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Photo Sorter - Videos</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><link rel="icon" href="data:,"></head>
<body><header><h1>Photo Sorter</h1><nav aria-label="Pages"><a href="/">Search</a><a href="/videos" aria-current="page">Videos</a><a href="/people">People</a><a href="/albums">Albums</a><a href="/cleanup">Clean up</a><a href="/verify">Verify</a><a href="/sync">Family sync</a></nav><a class="syncchip" id="syncchip" href="/sync" hidden></a><span id="total" class="status"></span></header>
<main>
<form class="filters" id="filters" role="search" aria-label="Search and filter videos">
  <input id="q" type="search" autocomplete="off" aria-label="Search videos: a name, place, album, or describe it"
    placeholder="Search videos: a name, place, or &quot;kids at the beach&quot;">
  <div id="dates"></div>
  <select id="place" aria-label="Place"><option value="">Any place</option></select>
  <select id="person" aria-label="Person"><option value="">Anyone</option></select>
  <select id="album" aria-label="Album"><option value="">Any album</option></select>
  <label><input type="checkbox" id="hide_live" checked> Hide Live Photo clips</label>
  <label><input type="checkbox" id="duplicates"> Duplicates only</label>
  <button type="button" id="clear">Clear filters</button>
  <button class="primary" id="go">Search</button>
</form>
<p class="status" id="nofmpeg" hidden>Video tools (ffmpeg) were not found, so videos are not being sorted. The installer includes them;
  when running from source, put ffmpeg and ffprobe on PATH or set PHOTOSORTER_FFMPEG_DIR.</p>
<div class="status" id="status" role="status" aria-live="polite"></div>
<div id="selbar"></div>
<div id="grid" class="vgrid"></div>
<div class="loadmore"><button id="more" hidden>Load more</button></div>
</main>
<script src="/static/common.js"></script>
<script src="/static/videos.js"></script>
</body></html>
